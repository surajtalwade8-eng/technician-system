<!DOCTYPE html>
<html lang="hi"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#25D366">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Cases">
<title>My Cases</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f0f4f8;min-height:100vh}
#loginScreen{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;background:linear-gradient(135deg,#25D366,#128C7E);padding:30px;text-align:center}
.lico{font-size:70px;margin-bottom:15px}
#loginScreen h1{color:white;font-size:28px;margin-bottom:8px}
#loginScreen p{color:rgba(255,255,255,0.85);margin-bottom:30px}
#loginScreen select{width:100%;max-width:350px;padding:18px;margin:10px 0;border:none;border-radius:15px;font-size:18px;outline:none}
.lbtn{width:100%;max-width:350px;padding:18px;background:white;color:#25D366;border:none;border-radius:15px;font-size:20px;font-weight:700;cursor:pointer;margin-top:10px;box-shadow:0 10px 25px rgba(0,0,0,0.15)}
.lerr{color:#ffcccc;font-size:14px;margin-top:10px}
#mainScreen{display:none}
.topbar{background:linear-gradient(135deg,#25D366,#128C7E);color:white;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}
.topbar h2{font-size:18px}
.ncnt{background:white;color:#f44336;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.tabs{display:flex;background:white;border-bottom:2px solid #e0f7e9}
.tab{flex:1;padding:14px 5px;text-align:center;cursor:pointer;font-size:14px;font-weight:600;color:#999;border-bottom:3px solid transparent;transition:0.2s}
.tab.on{color:#25D366;border-bottom:3px solid #25D366;background:#f0fff9}
.list{padding:15px;overflow-y:auto;height:calc(100vh - 160px)}
.card{background:white;border-radius:15px;padding:20px;margin-bottom:15px;box-shadow:0 3px 12px rgba(0,0,0,0.08)}
.card.nc{border-left:5px solid #f44336}
.card.ac{border-left:5px solid #2196F3}
.card.dc{border-left:5px solid #4CAF50}
.cid{font-size:11px;color:#bbb;font-weight:600;margin-bottom:6px}
.cname{font-size:19px;font-weight:700;color:#111;margin-bottom:5px}
.caddr{color:#555;font-size:14px;margin:8px 0;line-height:1.5}
.cprob{background:#fff8f0;padding:12px;border-radius:10px;font-size:13px;color:#555;margin:10px 0}
.chip{display:inline-block;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;margin:3px}
.cN{background:#ffebee;color:#c62828}.cA{background:#e3f2fd;color:#1565c0}.cD{background:#e8f5e9;color:#2e7d32}.cM{background:#f3e5f5;color:#6a1b9a}
.abtn{width:100%;padding:16px;border:none;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer;margin:5px 0;transition:0.2s}
.abtn:active{transform:scale(0.97)}
.acc{background:linear-gradient(135deg,#25D366,#128C7E);color:white}
.don{background:linear-gradient(135deg,#4CAF50,#388E3C);color:white}
.cal{background:#2196F3;color:white}
.empty{text-align:center;padding:60px 20px;color:#ccc}
.empty div{font-size:55px;margin-bottom:15px}
#popup{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;justify-content:center;align-items:center;padding:20px}
#popup.on{display:flex;animation:popIn 0.4s ease}
@keyframes popIn{from{transform:scale(0.6);opacity:0}to{transform:scale(1);opacity:1}}
.pbox{background:white;border-radius:25px;padding:30px 22px;width:100%;max-width:380px;text-align:center}
.pico{font-size:60px;animation:bounce 0.5s infinite alternate}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-10px)}}
.ptitle{font-size:22px;font-weight:700;color:#f44336;margin:12px 0 5px}
.pcust{font-size:19px;font-weight:700;margin:5px 0}
.paddr{background:#e8f5e9;padding:12px;border-radius:10px;margin:10px 0;font-size:14px;color:#2e7d32}
.pprob{background:#fff3cd;padding:10px;border-radius:10px;font-size:13px;color:#666;margin:8px 0}
.pid{font-size:11px;color:#bbb;margin:8px 0}
.pacc{width:100%;padding:18px;background:linear-gradient(135deg,#25D366,#128C7E);color:white;border:none;border-radius:15px;font-size:20px;font-weight:700;cursor:pointer;margin-top:12px;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 5px 15px rgba(37,211,102,0.4)}50%{box-shadow:0 5px 35px rgba(37,211,102,0.8)}}
.pbusy{width:100%;padding:14px;background:#ff9800;color:white;border:none;border-radius:15px;font-size:17px;font-weight:700;cursor:pointer;margin-top:8px}
#repModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9998;justify-content:flex-end;align-items:flex-end}
#repModal.on{display:flex;animation:slideUp 0.3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.rbox{background:white;border-radius:25px 25px 0 0;padding:25px 20px;width:100%;max-height:92vh;overflow-y:auto}
.rbox h2{color:#25D366;text-align:center;font-size:20px;margin-bottom:15px}
.rinfo{background:#f0f8ff;padding:14px;border-radius:12px;margin-bottom:18px;font-size:13px;line-height:2}
.rbox label{display:block;font-weight:700;color:#333;margin:12px 0 4px;font-size:14px}
.rbox input,.rbox select,.rbox textarea{width:100%;padding:13px;border:2px solid #e8e8e8;border-radius:10px;font-size:15px;outline:none;font-family:Arial;box-sizing:border-box}
.rbox input:focus,.rbox select:focus,.rbox textarea:focus{border-color:#25D366}
.rsub{width:100%;padding:18px;background:linear-gradient(135deg,#25D366,#128C7E);color:white;border:none;border-radius:15px;font-size:18px;font-weight:700;cursor:pointer;margin-top:15px}
.rcan{width:100%;padding:14px;background:#f5f5f5;color:#888;border:none;border-radius:15px;font-size:16px;cursor:pointer;margin-top:8px}
.outbtn{background:rgba(255,255,255,0.2);color:white;border:none;padding:8px 14px;border-radius:20px;cursor:pointer;font-size:13px}
</style></head><body>
<div id="loginScreen">
<div class="lico">&#128295;</div>
<h1>Technician App</h1>
<p>Apna naam select karke login karo</p>
<select id="tSel"><option value="">Loading...</option></select>
<div id="lerr" class="lerr"></div>
<button class="lbtn" onclick="doLogin()">&#128640; LOGIN</button>
</div>
<div id="mainScreen">
<div class="topbar">
<div><div style="font-size:12px;opacity:0.8">Welcome &#128075;</div><h2 id="tNm">Tech</h2></div>
<div style="display:flex;gap:12px;align-items:center"><div class="ncnt" id="nCnt">0</div><button class="outbtn" onclick="doLogout()">Logout</button></div>
</div>
<div class="tabs">
<div class="tab on" id="t-New" onclick="showTab('New')">&#128308; New</div>
<div class="tab" id="t-Accepted" onclick="showTab('Accepted')">&#128309; Accepted</div>
<div class="tab" id="t-Done" onclick="showTab('Done')">&#9989; Done</div>
</div>
<div class="list" id="cList"></div>
</div>
<div id="popup">
<div class="pbox">
<div class="pico">&#128276;</div>
<div class="ptitle">&#9889; NEW CASE ASSIGNED!</div>
<div class="pcust" id="pCust"></div>
<div class="paddr">&#128205; <span id="pAddr"></span></div>
<div class="pprob">&#9888; <span id="pProb"></span></div>
<div class="pid">Ticket: <span id="pTkt"></span></div>
<button class="pacc" onclick="accFromPopup()">&#9989; ACCEPT CASE NOW</button>
<button class="pbusy" onclick="closePopup()">&#9203; Baad Me Dekhunga</button>
</div></div>
<div id="repModal">
<div class="rbox">
<h2>&#128203; Completion Report</h2>
<div class="rinfo" id="rInfo"></div>
<label>&#9989; Kya Kaam Kiya? *</label>
<textarea id="rWork" rows="3" placeholder="Toner replace, head clean..."></textarea>
<label>&#128295; Parts Used</label>
<input id="rParts" placeholder="HP 12A Toner (ya N/A)">
<label>&#9201; Time Taken</label>
<select id="rTime"><option>30 minutes</option><option>1 hour</option><option>1.5 hours</option><option>2 hours</option><option>2+ hours</option><option>Half Day</option><option>Full Day</option></select>
<label>&#128176; Service Charge (&#8377;)</label>
<input id="rCharge" type="number" placeholder="500">
<label>&#128512; Customer Feedback</label>
<select id="rFb"><option>Excellent</option><option>Good</option><option>Average</option><option>Below Average</option></select>
<label>&#128221; Remarks</label>
<textarea id="rRem" rows="2" placeholder="Extra information..."></textarea>
<button class="rsub" onclick="subReport()">&#9989; Submit + Mark DONE</button>
<button class="rcan" onclick="closeRep()">Cancel</button>
</div></div>
<script>
var db, myKey="", myName="", myCases=[], curTab="New", popKey="", repKey="", firstLoad=true;
var alertInterval=null, alertCtx=null;

// FIREBASE INIT
function initFirebase() {
  try {
    if(!firebase.apps.length) {
      firebase.initializeApp({
        apiKey:"AIzaSyCmhzQqH60pyOD-qwCcm52nCXmT0n1Buy0",
        authDomain:"tech-b30b8.firebaseapp.com",
        databaseURL:"https://tech-b30b8-default-rtdb.asia-southeast1.firebasedatabase.app/",
        projectId:"tech-b30b8",
        storageBucket:"tech-b30b8.firebasestorage.app",
        messagingSenderId:"815434648437",
        appId:"1:815434648437:web:bd11c672f57fc24e1ba13c"
      });
    }
    db = firebase.database();
    return true;
  } catch(e) {
    document.getElementById("lerr").textContent = "Firebase Error: " + e.message;
    return false;
  }
}

// PAGE LOAD
window.onload = function() {
  if(!initFirebase()) return;
  myKey = localStorage.getItem("tk") || "";
  myName = localStorage.getItem("tn") || "";
  if(myKey && myName) {
    startApp();
  } else {
    loadTechs();
  }
};

// LOAD TECHS
function loadTechs() {
  db.ref("technicians").once("value").then(function(snap) {
    var sel = document.getElementById("tSel");
    sel.innerHTML = '<option value="">-- Apna naam select karo --</option>';
    if(snap.exists()) {
      snap.forEach(function(c) {
        var t = c.val();
        sel.add(new Option(t.name, c.key + "|" + t.name));
      });
    } else {
      sel.innerHTML = '<option value="">Koi technician nahi (Admin se add karwao)</option>';
    }
  }).catch(function(e) {
    document.getElementById("lerr").textContent = "Error: " + e.message + " — Page refresh karo";
  });
}

function doLogin() {
  var v = document.getElementById("tSel").value;
  if(!v || v.indexOf("|") === -1) { alert("Naam select karo!"); return; }
  var p = v.split("|");
  myKey = p[0]; myName = p[1];
  localStorage.setItem("tk", myKey);
  localStorage.setItem("tn", myName);
  startApp();
}

function doLogout() {
  stopAlertSound();
  localStorage.removeItem("tk");
  localStorage.removeItem("tn");
  location.reload();
}

// START APP
function startApp() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("mainScreen").style.display = "block";
  document.getElementById("tNm").textContent = myName;
  if("Notification" in window) Notification.requestPermission();

  db.ref("cases").orderByChild("techKey").equalTo(myKey).on("value", function(snap) {
    var prevIds = [];
    for(var i=0;i<myCases.length;i++) prevIds.push(myCases[i].key);

    myCases = [];
    if(snap.exists()) snap.forEach(function(c){ var d=c.val(); d.key=c.key; myCases.unshift(d); });

    var newCount = 0;
    for(var i=0;i<myCases.length;i++){ if(myCases[i].status==="New") newCount++; }
    document.getElementById("nCnt").textContent = newCount;

    if(!firstLoad) {
      for(var i=0;i<myCases.length;i++) {
        var c = myCases[i];
        var alreadyExisted = false;
        for(var j=0;j<prevIds.length;j++){ if(prevIds[j]===c.key){ alreadyExisted=true; break; } }
        if(!alreadyExisted && c.status==="New") {
          showPopup(c);
          break;
        }
      }
    }
    firstLoad = false;
    render();
  });
}

// ===== CONTINUOUS AUDIO ALERT =====
function playAlertSound() {
  stopAlertSound();
  function beep() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();

      var o1 = ctx.createOscillator();
      var g1 = ctx.createGain();
      o1.connect(g1); g1.connect(ctx.destination);
      o1.type="sine"; o1.frequency.value=880;
      g1.gain.setValueAtTime(0.8, ctx.currentTime);
      g1.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.4);
      o1.start(ctx.currentTime); o1.stop(ctx.currentTime+0.4);

      var o2 = ctx.createOscillator();
      var g2 = ctx.createGain();
      o2.connect(g2); g2.connect(ctx.destination);
      o2.type="sine"; o2.frequency.value=660;
      g2.gain.setValueAtTime(0.8, ctx.currentTime+0.45);
      g2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.85);
      o2.start(ctx.currentTime+0.45); o2.stop(ctx.currentTime+0.85);

      var o3 = ctx.createOscillator();
      var g3 = ctx.createGain();
      o3.connect(g3); g3.connect(ctx.destination);
      o3.type="sine"; o3.frequency.value=1100;
      g3.gain.setValueAtTime(1.0, ctx.currentTime+0.9);
      g3.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+1.5);
      o3.start(ctx.currentTime+0.9); o3.stop(ctx.currentTime+1.5);

    } catch(e){ console.log("Audio:",e); }
  }
  beep();
  alertInterval = setInterval(beep, 2500);
}

function stopAlertSound() {
  if(alertInterval){ clearInterval(alertInterval); alertInterval=null; }
}

// ===== POPUP =====
function showPopup(c) {
  popKey = c.key;
  document.getElementById("pCust").textContent = c.customer + " (" + c.mobile + ")";
  document.getElementById("pAddr").textContent = c.address;
  document.getElementById("pProb").textContent = c.problem;
  document.getElementById("pTkt").textContent = c.id;
  document.getElementById("popup").classList.add("on");
  document.title = "NEW CASE! - " + c.customer;

  playAlertSound();
  if(navigator.vibrate) navigator.vibrate([500,200,500,200,500,200,500,200,500]);

  if(Notification.permission==="granted") {
    new Notification("New Case!", { body: c.customer + " - " + c.address, requireInteraction:true });
  }
}

function closePopup() {
  document.getElementById("popup").classList.remove("on");
  stopAlertSound();
  document.title = "My Cases";
}

function accFromPopup() {
  if(popKey) {
    db.ref("cases/" + popKey).update({status:"Accepted"});
    closePopup();
    showTab("Accepted");
  }
}

// ===== TABS =====
function showTab(t) {
  curTab = t;
  var all = ["New","Accepted","Done"];
  for(var i=0;i<all.length;i++) {
    document.getElementById("t-"+all[i]).className = (all[i]===t) ? "tab on" : "tab";
  }
  render();
}

// ===== RENDER =====
function render() {
  var list = document.getElementById("cList");
  var f = [];
  for(var i=0;i<myCases.length;i++){ if(myCases[i].status===curTab) f.push(myCases[i]); }

  if(!f.length) {
    var icons = {New:"&#127881;", Accepted:"&#128203;", Done:"&#9989;"};
    var msgs = {New:"Koi naya case nahi!", Accepted:"Koi accepted case nahi!", Done:"Koi completed case nahi!"};
    list.innerHTML = '<div class="empty"><div>' + icons[curTab] + '</div><p>' + msgs[curTab] + '</p></div>';
    return;
  }

  var h = "";
  for(var j=0;j<f.length;j++) {
    var c = f[j];
    var cls = c.status==="New"?"nc":c.status==="Accepted"?"ac":"dc";
    var ch  = c.status==="New"?"cN":c.status==="Accepted"?"cA":"cD";
    h += '<div class="card '+cls+'">';
    h += '<div class="cid">'+c.id+' &bull; '+(c.date||"")+'</div>';
    h += '<div class="cname">&#128100; '+c.customer+'</div>';
    h += '<div class="caddr">&#128222; '+c.mobile+'<br>&#128205; '+c.address+'</div>';
    h += '<div class="cprob">&#9888; '+c.problem+'</div>';
    h += '<div><span class="chip cM">&#128247; '+(c.model||"N/A")+'</span>';
    h += '<span class="chip '+ch+'">'+c.status+'</span></div>';
    if(c.status==="New")      h += '<button class="abtn acc" onclick="accCase(\''+c.key+'\')">&#9989; ACCEPT CASE</button>';
    if(c.status==="Accepted") h += '<button class="abtn don" onclick="openRep(\''+c.key+'\')">&#128203; DONE + REPORT</button>';
    h += '<button class="abtn cal" onclick="window.location.href=\'tel:'+c.mobile+'\'">&#128222; Call Customer</button>';
    h += '</div>';
  }
  list.innerHTML = h;
}

function accCase(k) {
  db.ref("cases/"+k).update({status:"Accepted"});
  showTab("Accepted");
}

// ===== REPORT MODAL =====
function openRep(k) {
  repKey = k;
  var c = null;
  for(var i=0;i<myCases.length;i++){ if(myCases[i].key===k){ c=myCases[i]; break; } }
  if(!c) return;
  document.getElementById("rInfo").innerHTML =
    "<strong>"+c.id+"</strong><br>"+
    "&#128100; "+c.customer+" &mdash; "+c.mobile+"<br>"+
    "&#128205; "+c.address+"<br>"+
    "&#9888; "+c.problem;
  document.getElementById("rWork").value = "";
  document.getElementById("rParts").value = "";
  document.getElementById("rCharge").value = "";
  document.getElementById("rRem").value = "";
  document.getElementById("repModal").classList.add("on");
}

function closeRep() { document.getElementById("repModal").classList.remove("on"); }

function subReport() {
  var w = document.getElementById("rWork").value.trim();
  if(!w){ alert("Kya kaam kiya - fill karo!"); return; }
  var c = null;
  for(var i=0;i<myCases.length;i++){ if(myCases[i].key===repKey){ c=myCases[i]; break; } }
  if(!c) return;

  var today = new Date().toLocaleDateString("hi-IN").split("/").join("-");
  var rep = {
    caseId:c.id, customer:c.customer, mobile:c.mobile, address:c.address,
    problem:c.problem, model:c.model||"N/A", techName:myName,
    workDone:w,
    partsUsed:document.getElementById("rParts").value||"N/A",
    timeTaken:document.getElementById("rTime").value,
    serviceCharge:document.getElementById("rCharge").value||"0",
    customerFeedback:document.getElementById("rFb").value,
    remarks:document.getElementById("rRem").value||"N/A",
    date:today,
    completedAt:new Date().toLocaleString("hi-IN")
  };

  db.ref("reports/"+myName+"/"+today+"/"+c.id).set(rep).then(function(){
    return db.ref("cases/"+repKey).update({status:"Done", report:rep, completedAt:rep.completedAt});
  }).then(function(){
    closeRep();
    showTab("Done");
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
    alert("Report submit! Case DONE!");
  }).catch(function(e){ alert("Error: "+e.message); });
}
</script></body></html>
