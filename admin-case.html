<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a237e">
<title>CWC Admin Panel</title>

<!-- Firebase SABSE PEHLE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>

firebase.initializeApp({
  apiKey:"AIzaSyCmhzQqH60pyOD-qwCcm52nCXmT0n1Buy0",
  authDomain:"tech-b30b8.firebaseapp.com",
  databaseURL:"https://tech-b30b8-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId:"tech-b30b8",
  storageBucket:"tech-b30b8.firebasestorage.app",
  messagingSenderId:"815434648437",
  appId:"1:815434648437:web:bd11c672f57fc24e1ba13c"

db   = firebase.database();
auth = firebase.auth();

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f0f2f5;min-height:100vh}
#loginScreen{display:flex;justify-content:center;align-items:center;min-height:100vh;background:linear-gradient(135deg,#1a237e,#283593);padding:20px}
.login-box{background:white;border-radius:20px;padding:35px 28px;width:100%;max-width:360px;text-align:center;box-shadow:0 15px 40px rgba(0,0,0,0.2)}
.admin-logo{width:80px;height:80px;background:linear-gradient(135deg,#1a237e,#283593);border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:34px}
.login-box h2{color:#1a237e;margin-bottom:6px;font-size:22px}
.login-box p{color:#999;font-size:13px;margin-bottom:22px}
.inp{width:100%;padding:14px;border:2px solid #e8e8e8;border-radius:10px;font-size:15px;outline:none;margin:6px 0;display:block}
.inp:focus{border-color:#1a237e}
.login-btn{width:100%;padding:15px;background:linear-gradient(135deg,#1a237e,#3949ab);color:white;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-top:12px}
.err-box{background:#ffebee;color:#c62828;padding:10px;border-radius:8px;font-size:13px;margin-top:10px;display:none}
#mainScreen{display:none}
.topbar{background:linear-gradient(135deg,#1a237e,#283593);color:white;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}
.topbar h1{font-size:18px}
.logout-btn{background:rgba(255,255,255,0.2);color:white;border:none;padding:8px 16px;border-radius:20px;cursor:pointer;font-size:13px}
.tabs{display:flex;background:white;border-bottom:2px solid #e8eaf6}
.tab{flex:1;padding:13px;text-align:center;cursor:pointer;font-size:13px;font-weight:600;color:#999;border-bottom:3px solid transparent}
.tab.on{color:#1a237e;border-bottom:3px solid #1a237e;background:#f5f7ff}
.content{padding:20px;max-width:700px;margin:0 auto}
.section-title{font-size:18px;font-weight:700;color:#1a237e;margin-bottom:16px}
.form-box{background:white;border-radius:16px;padding:22px;margin-bottom:20px;box-shadow:0 3px 12px rgba(0,0,0,0.07)}
.form-box h3{font-size:15px;font-weight:700;color:#333;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid #e8eaf6}
label{display:block;font-weight:700;color:#444;font-size:13px;margin:10px 0 4px}
input,select{width:100%;padding:12px;border:2px solid #e8e8e8;border-radius:9px;font-size:14px;outline:none;display:block}
input:focus,select:focus{border-color:#1a237e}
.submit-btn{width:100%;padding:14px;background:linear-gradient(135deg,#1a237e,#3949ab);color:white;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:12px}
.success-box{background:#e8f5e9;color:#2e7d32;padding:10px;border-radius:8px;font-size:13px;margin-top:10px;display:none}
.error-box{background:#ffebee;color:#c62828;padding:10px;border-radius:8px;font-size:13px;margin-top:10px;display:none}
.tech-card{background:white;border-radius:12px;padding:16px 18px;margin-bottom:12px;box-shadow:0 3px 10px rgba(0,0,0,0.06);display:flex;justify-content:space-between;align-items:center;border-left:4px solid #1a237e}
.tech-info h4{font-size:16px;font-weight:700;color:#111;margin-bottom:3px}
.tech-info p{font-size:12px;color:#888}
.tech-actions{display:flex;gap:8px;flex-shrink:0}
.del-btn{background:#ffebee;color:#c62828;border:none;padding:7px 13px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700}
.reset-btn{background:#e3f2fd;color:#1565c0;border:none;padding:7px 13px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700}
.empty{text-align:center;padding:40px;color:#bbb;font-size:14px}
.badge{display:inline-block;background:#e8eaf6;color:#1a237e;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;margin-top:4px}
small{color:#999;font-size:11px;display:block;margin-top:2px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="admin-logo">⚙️</div>
    <h2>CWC Admin Panel</h2>
    <p>Sirf admin login kar sakta hai</p>
    <input class="inp" type="email" id="adminEmail" placeholder="Admin Email" autocomplete="email">
    <input class="inp" type="password" id="adminPass" placeholder="Password"
           autocomplete="current-password"
           onkeydown="if(event.key==='Enter') doAdminLogin()">
    <div class="err-box" id="loginErr"></div>
    <button class="login-btn" id="loginBtn" onclick="doAdminLogin()">LOGIN</button>
  </div>
</div>

<!-- MAIN -->
<div id="mainScreen">
  <div class="topbar">
    <div>
      <div style="font-size:11px;opacity:0.7">CWC</div>
      <h1>👑 Admin Panel</h1>
    </div>
    <button class="logout-btn" onclick="doLogout()">Logout</button>
  </div>
  <div class="tabs">
    <div class="tab on" id="tab-add" onclick="showTab('add')">➕ Add Technician</div>
    <div class="tab" id="tab-list" onclick="showTab('list')">👥 All Technicians</div>
  </div>

  <!-- ADD -->
  <div id="page-add" class="content">
    <div class="section-title">Naya Technician Add Karo</div>
    <div class="form-box">
      <h3>Technician Details</h3>
      <label>Full Name *</label>
      <input id="tName" placeholder="Ramesh Kumar">
      <label>User ID (Login ke liye) *</label>
      <input id="tUserId" placeholder="ramesh01"
             oninput="this.value=this.value.toLowerCase().replace(/[^a-z0-9_]/g,'')">
      <small>Sirf small letters, numbers, underscore — koi space nahi</small>
      <label>Password *</label>
      <input type="password" id="tPass" placeholder="Min 6 characters">
      <label>Mobile Number</label>
      <input id="tMobile" placeholder="9876543210" type="tel">
      <label>Area / Zone</label>
      <input id="tArea" placeholder="Pune North">
      <div class="success-box" id="addSuccess"></div>
      <div class="error-box" id="addError"></div>
      <button class="submit-btn" onclick="addTechnician()">✅ ADD TECHNICIAN</button>
    </div>
  </div>

  <!-- LIST -->
  <div id="page-list" class="content" style="display:none">
    <div class="section-title">All Technicians</div>
    <div id="techList"><div class="empty">Loading...</div></div>
  </div>
</div>

<!-- ALL JS AT BOTTOM -->
<script>
// ===== ADMIN LOGIN =====
function doAdminLogin(){
  var email = document.getElementById("adminEmail").value.trim();
  var pass  = document.getElementById("adminPass").value;
  var errEl = document.getElementById("loginErr");
  var btn   = document.getElementById("loginBtn");
  errEl.style.display = "none";

  if(!email || !pass){
    errEl.textContent = "Email aur Password dono bharo!";
    errEl.style.display = "block";
    return;
  }

  btn.textContent = "Checking...";
  btn.disabled = true;

  auth.signInWithEmailAndPassword(email, pass)
    .then(function(){
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("mainScreen").style.display  = "block";
      loadTechList();
    })
    .catch(function(e){
      btn.textContent = "LOGIN";
      btn.disabled = false;
      errEl.textContent = "❌ " + e.message;
      errEl.style.display = "block";
    });
}

function doLogout(){
  auth.signOut().then(function(){ location.reload(); });
}

// ===== TABS =====
function showTab(t){
  ["add","list"].forEach(function(x){
    document.getElementById("tab-"+x).className  = (x===t) ? "tab on" : "tab";
    document.getElementById("page-"+x).style.display = (x===t) ? "block" : "none";
  });
  if(t === "list") loadTechList();
}

// ===== ADD TECHNICIAN =====
function addTechnician(){
  var name   = document.getElementById("tName").value.trim();
  var userId = document.getElementById("tUserId").value.trim();
  var pass   = document.getElementById("tPass").value;
  var mobile = document.getElementById("tMobile").value.trim();
  var area   = document.getElementById("tArea").value.trim();
  var succEl = document.getElementById("addSuccess");
  var errEl  = document.getElementById("addError");
  succEl.style.display = "none";
  errEl.style.display  = "none";

  if(!name)            { errEl.textContent="Name required!"; errEl.style.display="block"; return; }
  if(userId.length<3)  { errEl.textContent="User ID min 3 characters!"; errEl.style.display="block"; return; }
  if(pass.length<6)    { errEl.textContent="Password min 6 characters!"; errEl.style.display="block"; return; }

  db.ref("technicians").orderByChild("userId").equalTo(userId).once("value")
    .then(function(snap){
      if(snap.exists()){
        errEl.textContent = "⚠️ Ye User ID already exist karta hai!";
        errEl.style.display = "block";
        return;
      }
      var passHash = btoa(pass + "_cwc_salt_2024");
      var key = db.ref("technicians").push().key;
      return db.ref("technicians/"+key).set({
        name: name,
        userId: userId,
        passHash: passHash,
        mobile: mobile || "N/A",
        area:   area   || "N/A",
        active: true,
        createdAt: new Date().toLocaleString("hi-IN")
      });
    })
    .then(function(res){
      if(res === undefined) return; // already returned above
      succEl.textContent = "✅ " + name + " (" + userId + ") add ho gaya!";
      succEl.style.display = "block";
      ["tName","tUserId","tPass","tMobile","tArea"].forEach(function(id){
        document.getElementById(id).value = "";
      });
      setTimeout(function(){ succEl.style.display="none"; }, 4000);
    })
    .catch(function(e){
      errEl.textContent = "Error: " + e.message;
      errEl.style.display = "block";
    });
}

// ===== LOAD LIST =====
function loadTechList(){
  var list = document.getElementById("techList");
  list.innerHTML = "<div class='empty'>Loading...</div>";
  db.ref("technicians").once("value").then(function(snap){
    list.innerHTML = "";
    if(!snap.exists()){
      list.innerHTML = "<div class='empty'>Koi technician nahi hai abhi</div>";
      return;
    }
    snap.forEach(function(c){
      var t = c.val();
      var card = document.createElement("div");
      card.className = "tech-card";
      card.innerHTML =
        '<div class="tech-info">' +
          '<h4>' + t.name + '</h4>' +
          '<p>ID: <b>' + t.userId + '</b> &nbsp;|&nbsp; ' + (t.mobile||"") + '</p>' +
          '<span class="badge">' + (t.area||"N/A") + '</span>' +
        '</div>' +
        '<div class="tech-actions">' +
          '<button class="reset-btn" onclick="resetPass(''+c.key+'',''+t.name+'')">Reset Pass</button>' +
          '<button class="del-btn"   onclick="deleteTech(''+c.key+'',''+t.name+'')">Delete</button>' +
        '</div>';
      list.appendChild(card);
    });
  });
}

// ===== DELETE =====
function deleteTech(key, name){
  if(!confirm(name + " ko delete karna chahte ho?")) return;
  db.ref("technicians/"+key).remove().then(loadTechList);
}

// ===== RESET PASSWORD =====
function resetPass(key, name){
  var np = prompt(name + " ka naya password daalo (min 6 char):");
  if(!np || np.length < 6){ alert("Min 6 characters!"); return; }
  var hash = btoa(np + "_cwc_salt_2024");
  db.ref("technicians/"+key+"/passHash").set(hash).then(function(){
    alert("✅ " + name + " ka password reset!
Naya: " + np);
  });
}

// ===== AUTO LOGIN CHECK =====
auth.onAuthStateChanged(function(user){
  if(user){
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("mainScreen").style.display  = "block";
    loadTechList();
  }
});
</script>
</body>
</html>
