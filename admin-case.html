<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Case Assignment</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  body{font-family:'Segoe UI',sans-serif;background:#f0f4f8;padding:20px;margin:0}
  .wrap{max-width:1200px;margin:auto}
  .header{background:linear-gradient(135deg,#25D366,#128C7E);color:white;padding:25px;border-radius:15px;text-align:center;margin-bottom:20px}
  .card{background:white;padding:25px;border-radius:15px;box-shadow:0 5px 20px rgba(0,0,0,0.08);margin-bottom:20px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}
  .stat{background:white;padding:20px;border-radius:15px;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,0.06)}
  .stat h2{margin:0;font-size:32px;color:#25D366}
  .stat p{margin:5px 0 0;color:#666;font-size:14px}
  input,select,textarea{width:100%;padding:13px;margin:6px 0;border:2px solid #e8e8e8;border-radius:10px;box-sizing:border-box;font-size:15px;outline:none;transition:0.2s}
  input:focus,select:focus,textarea:focus{border-color:#25D366}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
  button{padding:13px 20px;border:none;border-radius:10px;cursor:pointer;font-size:15px;font-weight:600;transition:0.3s;width:100%;margin:5px 0}
  .btn-green{background:linear-gradient(135deg,#25D366,#128C7E);color:white}
  .btn-green:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(37,211,102,0.4)}
  .btn-blue{background:#2196F3;color:white}
  .btn-red{background:#f44336;color:white}
  .btn-wa{background:#00ff88;color:#000;font-weight:bold}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{background:#f8fffe;padding:13px;text-align:left;border-bottom:2px solid #e0f7e9;color:#128C7E;font-weight:700}
  td{padding:12px 13px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
  tr:hover td{background:#f8fffb}
  .badge{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;display:inline-block}
  .badge-new{background:#fff3cd;color:#d67e00}
  .badge-accepted{background:#cce5ff;color:#0066cc}
  .badge-progress{background:#ffe0b2;color:#e65100}
  .badge-done{background:#d4edda;color:#28a745}
  .actions button{width:auto;padding:8px 14px;font-size:13px;margin:2px}
  .tech-tag{display:inline-block;background:#e8f5e9;color:#1b5e20;padding:4px 10px;border-radius:20px;font-size:13px;margin:3px}
  #newBadge{background:#f44336;color:white;border-radius:50%;padding:2px 7px;font-size:12px;margin-left:5px;display:none}
  .search-row{display:flex;gap:10px;margin-bottom:15px}
  .search-row input{margin:0}
  #notification-popup{display:none;position:fixed;top:20px;right:20px;background:white;border-left:5px solid #25D366;padding:20px;border-radius:15px;box-shadow:0 10px 40px rgba(0,0,0,0.2);z-index:999;max-width:350px;animation:slideIn 0.3s ease}
  @keyframes slideIn{from{transform:translateX(400px)}to{transform:translateX(0)}}
  @media(max-width:768px){.grid2{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>🔧 Technician Assignment Dashboard</h1>
    <p>Admin Panel — Firebase Real-time Sync ✅</p>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat"><h2 id="sTotal">0</h2><p>Total Cases</p></div>
    <div class="stat"><h2 id="sNew" style="color:#d67e00">0</h2><p>New</p></div>
    <div class="stat"><h2 id="sAccepted" style="color:#0066cc">0</h2><p>Accepted</p></div>
    <div class="stat"><h2 id="sDone" style="color:#28a745">0</h2><p>Done</p></div>
  </div>

  <!-- Technician Add -->
  <div class="card">
    <h3>👥 Technician Manage</h3>
    <div class="grid2">
      <input id="tName" placeholder="Technician Name *">
      <input id="tNum" placeholder="WhatsApp Number (9022340552) *">
    </div>
    <button class="btn-blue" onclick="addTech()">➕ Add Technician</button>
    <div id="techTags" style="margin-top:10px"></div>
  </div>

  <!-- New Case Form -->
  <div class="card">
    <h3>➕ New Case Assign</h3>
    <div class="grid2">
      <input id="cCustomer" placeholder="Customer Name *">
      <input id="cMobile" placeholder="Customer Mobile *">
    </div>
    <input id="cAddress" placeholder="📍 Full Address * (Shop no, Area, City)">
    <div class="grid2">
      <input id="cModel" placeholder="Product Model (HP 1020)">
      <select id="cTech"><option value="">Select Technician *</option></select>
    </div>
    <textarea id="cProblem" placeholder="Problem Details *" rows="3"></textarea>
    <button class="btn-green" onclick="assignCase()">🚀 ASSIGN CASE + WhatsApp Notify</button>
  </div>

  <!-- Cases Table -->
  <div class="card">
    <h3>📋 All Cases <span id="newBadge" id="newBadge"></span></h3>
    <div class="search-row">
      <input id="searchInput" placeholder="🔍 Search..." onkeyup="filterTable()">
      <button class="btn-blue" style="width:auto;white-space:nowrap" onclick="exportExcel()">📊 Export Excel</button>
    </div>
    <div style="overflow-x:auto">
      <table id="caseTable">
        <thead><tr>
          <th>Ticket</th><th>Date</th><th>Customer</th><th>Address</th><th>Problem</th><th>Technician</th><th>Status</th><th>Actions</th>
        </tr></thead>
        <tbody id="caseBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Notification Popup -->
<div id="notification-popup">
  <div style="font-size:20px;font-weight:bold" id="popTitle">🔔 Update</div>
  <div style="margin-top:10px" id="popBody"></div>
  <button onclick="closePopup()" style="margin-top:15px;padding:8px;background:#25D366;color:white;border:none;border-radius:8px;cursor:pointer;width:100%">✓ OK</button>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCmhzQqH60pyOD-qwCcm52nCXmT0n1Buy0",
  authDomain: "tech-b30b8.firebaseapp.com",
  databaseURL: "https://tech-b30b8-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "tech-b30b8",
  storageBucket: "tech-b30b8.firebasestorage.app",
  messagingSenderId: "815434648437",
  appId: "1:815434648437:web:bd11c672f57fc24e1ba13c"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let technicians = [];
let allCases = [];

// Load Technicians
db.ref('technicians').on('value', snap => {
  technicians = [];
  const sel = document.getElementById('cTech');
  sel.innerHTML = '<option value="">Select Technician *</option>';
  document.getElementById('techTags').innerHTML = '';
  if(snap.exists()) {
    snap.forEach(child => {
      const t = child.val();
      technicians.push({key: child.key, ...t});
      const opt = new Option(`${t.name} (${t.number})`, child.key);
      sel.add(opt);
      document.getElementById('techTags').innerHTML += `<span class="tech-tag">👨‍🔧 ${t.name} — ${t.number} <span style="cursor:pointer;color:#f44336" onclick="deleteTech('${child.key}')">✕</span></span>`;
    });
  }
});

// Load Cases - REAL TIME
db.ref('cases').orderByChild('timestamp').on('value', snap => {
  allCases = [];
  if(snap.exists()) {
    snap.forEach(child => allCases.unshift({key: child.key, ...child.val()}));
  }
  renderTable(allCases);
  updateStats();
});

// Status changes - show popup for admin
db.ref('cases').on('child_changed', snap => {
  const c = snap.val();
  if(c.status === 'Accepted') {
    showPopup(`✅ Case Accepted!`, `${c.techName} ne case ACCEPT kiya!\nCustomer: ${c.customer}\nTicket: ${c.id}`);
  } else if(c.status === 'Done') {
    showPopup(`🎉 Case Completed!`, `${c.techName} ne case DONE kiya!\nCustomer: ${c.customer}`);
  }
});

function addTech() {
  const name = document.getElementById('tName').value.trim();
  const num = document.getElementById('tNum').value.trim();
  if(!name || num.length < 10) return alert('Name aur 10 digit number daalo!');
  db.ref('technicians').push({name, number: num});
  document.getElementById('tName').value = '';
  document.getElementById('tNum').value = '';
}

function deleteTech(key) {
  if(confirm('Delete this technician?')) db.ref('technicians/' + key).remove();
}

function assignCase() {
  const customer = document.getElementById('cCustomer').value.trim();
  const mobile = document.getElementById('cMobile').value.trim();
  const address = document.getElementById('cAddress').value.trim();
  const problem = document.getElementById('cProblem').value.trim();
  const techKey = document.getElementById('cTech').value;

  if(!customer || !mobile || !address || !problem || !techKey) {
    return alert('Sab * fields fill karo!');
  }

  const tech = technicians.find(t => t.key === techKey);
  const caseId = 'CASE' + Date.now().toString().slice(-5);
  const caseData = {
    id: caseId,
    customer, mobile, address, problem,
    model: document.getElementById('cModel').value || 'N/A',
    techKey, techName: tech.name, techNumber: tech.number,
    status: 'New',
    timestamp: firebase.database.ServerValue.TIMESTAMP,
    date: new Date().toLocaleString('hi-IN')
  };

  db.ref('cases/' + caseId).set(caseData).then(() => {
    // Clear form
    ['cCustomer','cMobile','cAddress','cModel','cProblem'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('cTech').value = '';

    // WhatsApp Notify
    const msg = `*🔧 NEW CASE ASSIGNED* 🔔

👤 *Customer:* ${customer}
📞 *Mobile:* ${mobile}
📍 *Address:* ${address}
🖨️ *Model:* ${caseData.model}
⚠️ *Problem:* ${problem}
🎫 *Ticket:* ${caseId}

👉 App kholo: [https://surajtalwade8-eng.github.io/technician-system/technician-app.html]

Reply:
✅ *ACCEPT*
⏳ *BUSY*
✅ *DONE*`;

    window.open(`https://wa.me/91${tech.number}?text=${encodeURIComponent(msg)}`, '_blank');
    showPopup('✅ Case Assigned!', `${tech.name} ko case assign hua!\nWhatsApp notification gaya!`);
  });
}

function renderTable(data) {
  const tbody = document.getElementById('caseBody');
  if(!data.length) { tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:30px;color:#999">No cases yet</td></tr>'; return; }
  tbody.innerHTML = data.map(c => `
    <tr>
      <td><strong>${c.id}</strong></td>
      <td style="white-space:nowrap;font-size:13px">${c.date||''}</td>
      <td>${c.customer}<br><small style="color:#666">${c.mobile}</small></td>
      <td style="font-size:13px">${c.address}</td>
      <td style="font-size:13px">${c.problem}</td>
      <td>👨‍🔧 ${c.techName}</td>
      <td><span class="badge badge-${(c.status||'new').toLowerCase()}">${c.status||'New'}</span></td>
      <td class="actions">
        <button class="btn-wa" onclick="sendWA('${c.key}')">📱</button>
        <button class="btn-blue" style="background:#2196F3" onclick="updateStatus('${c.key}','Accepted')">✓</button>
        <button class="btn-green" style="background:#4CAF50" onclick="updateStatus('${c.key}','Done')">Done</button>
        <button class="btn-red" style="background:#f44336;font-size:12px" onclick="deleteCase('${c.key}')">🗑</button>
      </td>
    </tr>`).join('');
}

function updateStatus(key, status) {
  db.ref('cases/' + key).update({status});
}

function deleteCase(key) {
  if(confirm('Delete this case?')) db.ref('cases/' + key).remove();
}

function sendWA(key) {
  const c = allCases.find(x => x.key === key);
  const msg = `*🔄 CASE REMINDER*\nCustomer: ${c.customer}\nAddress: ${c.address}\nProblem: ${c.problem}\nTicket: ${c.id}\nStatus: ${c.status}`;
  window.open(`https://wa.me/91${c.techNumber}?text=${encodeURIComponent(msg)}`, '_blank');
}

function updateStats() {
  document.getElementById('sTotal').textContent = allCases.length;
  document.getElementById('sNew').textContent = allCases.filter(c => c.status==='New').length;
  document.getElementById('sAccepted').textContent = allCases.filter(c => c.status==='Accepted').length;
  document.getElementById('sDone').textContent = allCases.filter(c => c.status==='Done').length;
}

function filterTable() {
  const term = document.getElementById('searchInput').value.toLowerCase();
  renderTable(allCases.filter(c =>
    [c.customer,c.techName,c.address,c.problem,c.id,c.status].join(' ').toLowerCase().includes(term)
  ));
}

function exportExcel() {
  const rows = [['ID','Date','Customer','Mobile','Address','Problem','Technician','Status']];
  allCases.forEach(c => rows.push([c.id,c.date,c.customer,c.mobile,c.address,c.problem,c.techName,c.status]));
  const csv = rows.map(r => r.map(v => `"${v||''}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,\uFEFF' + encodeURIComponent(csv);
  a.download = `cases_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

function showPopup(title, body) {
  document.getElementById('popTitle').textContent = title;
  document.getElementById('popBody').textContent = body;
  document.getElementById('notification-popup').style.display = 'block';
  setTimeout(closePopup, 8000);
}
function closePopup() { document.getElementById('notification-popup').style.display = 'none'; }
</script>
</body>
</html>
