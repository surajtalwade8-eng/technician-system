<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#25D366">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Cases">
<title>My Cases - Technician</title>
<link rel="manifest" id="manifest">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',sans-serif;background:#f0f4f8;min-height:100vh}
  #loginScreen{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;background:linear-gradient(135deg,#25D366,#128C7E);padding:30px}
  #loginScreen h1{color:white;font-size:28px;margin-bottom:10px;text-align:center}
  #loginScreen p{color:rgba(255,255,255,0.85);margin-bottom:30px;text-align:center}
  #loginScreen input,#loginScreen select{width:100%;max-width:350px;padding:18px;margin:10px 0;border:none;border-radius:15px;font-size:18px;outline:none}
  #loginScreen button{width:100%;max-width:350px;padding:18px;margin-top:15px;background:white;color:#25D366;border:none;border-radius:15px;font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,0.2)}

  #mainScreen{display:none}
  .app-header{background:linear-gradient(135deg,#25D366,#128C7E);color:white;padding:20px;display:flex;justify-content:space-between;align-items:center}
  .app-header h2{font-size:20px}
  .badge-count{background:white;color:#25D366;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}

  .tabs{display:flex;background:white;border-bottom:2px solid #e0f7e9}
  .tab{flex:1;padding:15px;text-align:center;cursor:pointer;font-size:15px;font-weight:600;color:#666;transition:0.2s}
  .tab.active{color:#25D366;border-bottom:3px solid #25D366;margin-bottom:-2px}

  .content{padding:15px;max-height:calc(100vh - 180px);overflow-y:auto}
  .case-card{background:white;border-radius:15px;padding:20px;margin-bottom:15px;box-shadow:0 3px 15px rgba(0,0,0,0.08);border-left:5px solid #25D366;animation:fadeIn 0.3s ease}
  .case-card.new-case{border-left:5px solid #f44336;background:#fff8f8}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
  .case-id{font-size:13px;color:#999;font-weight:600}
  .case-customer{font-size:20px;font-weight:700;color:#1a1a1a;margin:5px 0}
  .case-address{color:#444;font-size:15px;margin:8px 0;display:flex;gap:8px;align-items:flex-start}
  .case-problem{background:#f8f9fa;padding:12px;border-radius:10px;margin:10px 0;font-size:15px}
  .case-tech-info{display:flex;gap:10px;margin:10px 0;flex-wrap:wrap}
  .info-chip{background:#e8f5e9;color:#2e7d32;padding:6px 12px;border-radius:20px;font-size:13px;font-weight:600}
  .btn-accept{width:100%;padding:18px;background:linear-gradient(135deg,#25D366,#128C7E);color:white;border:none;border-radius:12px;font-size:20px;font-weight:700;cursor:pointer;margin:5px 0;box-shadow:0 8px 20px rgba(37,211,102,0.3)}
  .btn-done{width:100%;padding:15px;background:linear-gradient(135deg,#4CAF50,#388E3C);color:white;border:none;border-radius:12px;font-size:18px;font-weight:700;cursor:pointer;margin:5px 0}
  .btn-call{width:100%;padding:15px;background:#2196F3;color:white;border:none;border-radius:12px;font-size:18px;font-weight:700;cursor:pointer;margin:5px 0}
  .status-chip{display:inline-block;padding:8px 20px;border-radius:25px;font-weight:700;font-size:14px}
  .s-new{background:#fff3cd;color:#d67e00}
  .s-accepted{background:#cce5ff;color:#0066cc}
  .s-done{background:#d4edda;color:#28a745}
  .empty{text-align:center;padding:60px 20px;color:#999}
  .empty div{font-size:60px;margin-bottom:20px}

  /* BIG NOTIFICATION POPUP */
  #bigPopup{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:9999;justify-content:center;align-items:center;padding:20px}
  #bigPopup.show{display:flex;animation:popIn 0.4s ease}
  @keyframes popIn{from{transform:scale(0.5);opacity:0}to{transform:scale(1);opacity:1}}
  .popup-inner{background:white;border-radius:25px;padding:30px;width:100%;max-width:400px;text-align:center;box-shadow:0 30px 60px rgba(0,0,0,0.3)}
  .popup-icon{font-size:70px;animation:bounce 0.5s infinite alternate}
  @keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-15px)}}
  .popup-title{font-size:26px;font-weight:700;color:#f44336;margin:15px 0 5px}
  .popup-customer{font-size:22px;font-weight:700;color:#1a1a1a;margin:5px 0}
  .popup-address{color:#444;font-size:16px;margin:10px 0;background:#f0f8ff;padding:12px;border-radius:10px}
  .popup-problem{background:#fff3cd;padding:12px;border-radius:10px;margin:10px 0;font-size:15px}
  .popup-accept-btn{width:100%;padding:20px;background:linear-gradient(135deg,#25D366,#128C7E);color:white;border:none;border-radius:15px;font-size:22px;font-weight:700;cursor:pointer;margin-top:15px;box-shadow:0 10px 30px rgba(37,211,102,0.4);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 10px 30px rgba(37,211,102,0.4)}50%{box-shadow:0 10px 50px rgba(37,211,102,0.8)}}
  .popup-busy-btn{width:100%;padding:15px;background:#ff9800;color:white;border:none;border-radius:15px;font-size:18px;font-weight:700;cursor:pointer;margin-top:10px}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <h1>🔧 Technician App</h1>
  <p>Apna naam select karo</p>
  <select id="techSelect" style="font-size:18px">
    <option value="">Loading technicians...</option>
  </select>
  <button onclick="login()">🚀 LOGIN</button>
</div>

<!-- MAIN SCREEN -->
<div id="mainScreen">
  <div class="app-header">
    <div>
      <div style="font-size:14px;opacity:0.85">Welcome 👋</div>
      <h2 id="techNameDisplay">Technician</h2>
    </div>
    <div style="display:flex;gap:15px;align-items:center">
      <div class="badge-count" id="newCount">0</div>
      <button onclick="logout()" style="background:rgba(255,255,255,0.2);color:white;border:none;padding:8px 15px;border-radius:20px;cursor:pointer">Logout</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="showTab('new')" id="tab-new">🔴 New</div>
    <div class="tab" onclick="showTab('accepted')" id="tab-accepted">🔵 Accepted</div>
    <div class="tab" onclick="showTab('done')" id="tab-done">✅ Done</div>
  </div>

  <div class="content" id="caseList"></div>
</div>

<!-- BIG POPUP NOTIFICATION -->
<div id="bigPopup">
  <div class="popup-inner">
    <div class="popup-icon">🔔</div>
    <div class="popup-title">NEW CASE ASSIGNED!</div>
    <div class="popup-customer" id="pCustomer"></div>
    <div class="popup-address">📍 <span id="pAddress"></span></div>
    <div class="popup-problem">⚠️ <span id="pProblem"></span></div>
    <div style="font-size:13px;color:#999;margin:10px 0">Ticket: <span id="pId"></span></div>
    <button class="popup-accept-btn" onclick="acceptFromPopup()">✅ ACCEPT CASE</button>
    <button class="popup-busy-btn" onclick="closePopup()">⏳ Baad Me Dekhunga</button>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCmhzQqH60pyOD-qwCcm52nCXmT0n1Buy0",
  authDomain: "tech-b30b8.firebaseapp.com",
  databaseURL: "https://tech-b30b8-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "tech-b30b8",
  storageBucket: "tech-b30b8.firebasestorage.app",
  messagingSenderId: "815434648437",
  appId: "1:815434648437:web:bd11c672f57fc24e1ba13c"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let myName = '', myKey = '', myCases = [], currentTab = 'new', popupCaseKey = '';
let isFirstLoad = true;

// Load technicians for login
db.ref('technicians').once('value', snap => {
  const sel = document.getElementById('techSelect');
  sel.innerHTML = '<option value="">Apna naam select karo</option>';
  if(snap.exists()) {
    snap.forEach(child => {
      const t = child.val();
      const opt = new Option(`👨‍🔧 ${t.name}`, child.key);
      sel.add(opt);
    });
  }
});

function login() {
  const sel = document.getElementById('techSelect');
  if(!sel.value) return alert('Apna naam select karo!');
  myKey = sel.value;
  myName = sel.selectedOptions[0].text.replace('👨‍🔧 ','');
  localStorage.setItem('techKey', myKey);
  localStorage.setItem('techName', myName);
  startApp();
}

function startApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainScreen').style.display = 'block';
  document.getElementById('techNameDisplay').textContent = myName;

  // Request notification permission
  if('Notification' in window) {
    Notification.requestPermission();
  }

  // REAL TIME LISTENER - Listen for my cases
  db.ref('cases').orderByChild('techKey').equalTo(myKey).on('value', snap => {
    myCases = [];
    if(snap.exists()) {
      snap.forEach(child => myCases.unshift({key: child.key, ...child.val()}));
    }

    const newCases = myCases.filter(c => c.status === 'New');
    document.getElementById('newCount').textContent = newCases.length;

    // Show big popup for new cases (not on first load)
    if(!isFirstLoad && newCases.length > 0) {
      const latest = newCases[0];
      showBigPopup(latest);
      // Browser notification
      if(Notification.permission === 'granted') {
        new Notification('🔥 New Case!', {
          body: `${latest.customer} — ${latest.address}`,
          icon: 'https://cdn.jsdelivr.net/npm/twemoji/assets/72x72/1f527.png',
          tag: latest.key,
          requireInteraction: true
        });
      }
    }
    isFirstLoad = false;
    renderCases();
  });
}

// Check auto-login
window.onload = () => {
  myKey = localStorage.getItem('techKey');
  myName = localStorage.getItem('techName');
  if(myKey && myName) startApp();
};

function logout() {
  localStorage.removeItem('techKey');
  localStorage.removeItem('techName');
  location.reload();
}

function showBigPopup(c) {
  popupCaseKey = c.key;
  document.getElementById('pCustomer').textContent = c.customer + ' — ' + c.mobile;
  document.getElementById('pAddress').textContent = c.address;
  document.getElementById('pProblem').textContent = c.problem;
  document.getElementById('pId').textContent = c.id;
  document.getElementById('bigPopup').classList.add('show');
  // Vibrate phone
  if(navigator.vibrate) navigator.vibrate([500,200,500,200,500]);
}

function closePopup() {
  document.getElementById('bigPopup').classList.remove('show');
}

function acceptFromPopup() {
  if(popupCaseKey) {
    db.ref('cases/' + popupCaseKey).update({status: 'Accepted'});
    closePopup();
  }
}

function showTab(tab) {
  currentTab = tab;
  ['new','accepted','done'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('active', t===tab);
  });
  renderCases();
}

function renderCases() {
  const list = document.getElementById('caseList');
  const filtered = myCases.filter(c => {
    if(currentTab === 'new') return c.status === 'New';
    if(currentTab === 'accepted') return c.status === 'Accepted';
    if(currentTab === 'done') return c.status === 'Done';
    return true;
  });

  if(!filtered.length) {
    list.innerHTML = `<div class="empty"><div>${currentTab==='new'?'🎉':currentTab==='done'?'📋':'⏳'}</div><p>${currentTab==='new'?'No new cases!':currentTab==='done'?'No completed cases':'No accepted cases'}</p></div>`;
    return;
  }

  list.innerHTML = filtered.map(c => `
    <div class="case-card ${c.status==='New'?'new-case':''}">
      <div class="case-id">${c.id} • ${c.date||''}</div>
      <div class="case-customer">👤 ${c.customer}</div>
      <div class="case-address">📍 <span>${c.address}</span></div>
      <div class="case-problem">⚠️ ${c.problem}</div>
      <div class="case-tech-info">
        <span class="info-chip">🖨️ ${c.model||'N/A'}</span>
        <span class="info-chip status-chip s-${(c.status||'new').toLowerCase()}">${c.status}</span>
      </div>
      ${c.status==='New'?`<button class="btn-accept" onclick="updateStatus('${c.key}','Accepted')">✅ ACCEPT CASE</button>`:''}
      ${c.status==='Accepted'?`<button class="btn-done" onclick="updateStatus('${c.key}','Done')">🎉 MARK AS DONE</button>`:''}
      <button class="btn-call" onclick="callCustomer('${c.mobile}')">📞 Call Customer</button>
    </div>
  `).join('');
}

function updateStatus(key, status) {
  db.ref('cases/' + key).update({status});
  if(status==='Accepted') showTab('accepted');
  if(status==='Done') showTab('done');
}

function callCustomer(mobile) {
  window.location.href = 'tel:' + mobile;
}
</script>
</body>
</html>
